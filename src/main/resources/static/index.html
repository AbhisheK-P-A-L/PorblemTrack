<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetTrack — Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Supabase JS SDK — handles auth directly, Spring Boot only validates JWTs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
</head>
<body>
<div class="auth-box">
  <h1>🧩 LeetTrack</h1>
  <p>Your SDE interview revision tracker</p>

  <div id="msg" class="msg" style="display:none"></div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  </div>

  <button class="btn btn-primary btn-block" id="loginBtn">Log In</button>

  <div class="auth-toggle">
    No account? <a id="toggleLink">Sign up instead</a>
  </div>
</div>

<script>
  const msgEl = document.getElementById("msg");
  let isSignup = false;

  // If already logged in, skip to search
  (async () => {
    const token = await getToken();
    if (token) window.location.href = "/search.html";
  })();

  document.getElementById("toggleLink").addEventListener("click", () => {
    isSignup = !isSignup;
    document.getElementById("loginBtn").textContent = isSignup ? "Sign Up" : "Log In";
    document.querySelector(".auth-toggle").innerHTML =
      isSignup
        ? 'Have an account? <a id="toggleLink">Log in instead</a>'
        : 'No account? <a id="toggleLink">Sign up instead</a>';
    document.getElementById("toggleLink").addEventListener("click", arguments.callee);
  });

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { showMsg(msgEl, "Enter email and password", "err"); return; }

    const sb = getSupabase();
    let result;

    if (isSignup) {
      result = await sb.auth.signUp({ email, password });
      if (!result.error) {
        showMsg(msgEl, "Account created! Check your email to confirm, then log in.", "ok");
        return;
      }
    } else {
      result = await sb.auth.signInWithPassword({ email, password });
    }

    if (result.error) {
      showMsg(msgEl, result.error.message, "err");
    } else {
      window.location.href = "/search.html";
    }
  });
</script>
</body>
</html>
