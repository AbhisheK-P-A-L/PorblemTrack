# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Database (Supabase Postgres) ─────────────────────────────────────────────
# Set these as environment variables on Render/Railway — never commit secrets.
# Local dev: export them in your shell or create a .env file + use a local runner.
#
# SUPABASE_DB_URL  = jdbc:postgresql://<host>:5432/postgres
# SUPABASE_DB_USER = postgres
# SUPABASE_DB_PASS = <your-db-password>
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.evdcqabtwuoxkdcsceca
spring.datasource.password=@/G#4#2wnZRcq2.
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (safe defaults for free-tier Supabase which caps at ~60 connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ── JPA ──────────────────────────────────────────────────────────────────────
# validate = verify schema matches entities but don't auto-create tables
# Use 'update' during first-time dev if you want JPA to create tables; switch to 'validate' after.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Spring Security — OAuth2 Resource Server (Supabase JWKS) ─────────────────
# Supabase exposes its public JWKS at: https://<your-project>.supabase.co/rest/v1/auth/v1/.well-known/jwks.json
# More precisely: https://<your-project-ref>.supabase.co/auth/v1/.well-known/jwks.json
#
# SUPABASE_JWKS_URI = https://<your-project-ref>.supabase.co/auth/v1/.well-known/jwks.json
# SUPABASE_JWT_ISSUER = https://<your-project-ref>.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://evdcqabtwuoxkdcsceca.supabase.co/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://evdcqabtwuoxkdcsceca.supabase.co/auth/v1

# ── Static files (frontend served by Spring Boot) ────────────────────────────
# Place HTML/CSS/JS under src/main/resources/static/
# Spring Boot will serve them at / automatically — no separate frontend deploy needed.
spring.web.resources.static-locations=classpath:/static/

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.leettrack=DEBUG
logging.level.org.springframework.security=DEBUG
